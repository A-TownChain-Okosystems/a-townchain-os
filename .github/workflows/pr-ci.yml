name: KAI-OS PR Validation

on:
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Linting & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
          else
            manifests=$(find . -name Cargo.toml -not -path './target/*' -not -path './archive/*' -print)
            test -n "$manifests"
            while IFS= read -r manifest; do
              cargo fmt --manifest-path "$manifest" -- --check
            done <<< "$manifests"
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            cargo test --workspace --all-features
          else
            manifests=$(find . -name Cargo.toml -not -path './target/*' -not -path './archive/*' -print)
            test -n "$manifests"
            while IFS= read -r manifest; do
              cargo test --manifest-path "$manifest" --all-features
            done <<< "$manifests"
          fi

  layer-integrity:
    name: Monorepo Architecture Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate KAI-OS Monorepo Structure
        shell: bash
        run: |
          set -euo pipefail
          echo "Prüfe Monorepo-Verzeichnisstruktur..."

          test -d .github/workflows
          test -f AGENTS.md
          test -f ARCHITECTURE.md
          test -f GOVERNANCE.md
          test -f README.md

          if [ -f Cargo.toml ]; then
            cargo metadata --no-deps --format-version 1 >/dev/null
          else
            echo "Kein Root-Cargo-Workspace vorhanden; prüfe vorhandene Cargo-Manifeste."
            manifests=$(find . -name Cargo.toml -not -path './target/*' -print)
            test -n "$manifests"
            while IFS= read -r manifest; do
              cargo metadata --manifest-path "$manifest" --no-deps --format-version 1 >/dev/null
            done <<< "$manifests"
          fi
